services:
  # ==========================================
  # 1. FastAPI Web Service (bodh-api)
  # ==========================================
  - type: web
    name: bodh-api
    env: docker
    dockerfilePath: Dockerfile.api
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bodh-db
          property: connectionString
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: STT_PROVIDER
        value: deepgram
      - key: TTS_PROVIDER
        value: sarvam
      - key: CORS_ORIGINS
        sync: false

  # ==========================================
  # 2. LiveKit Agent Background Worker (bodh-agent)
  # ==========================================
  - type: worker
    name: bodh-agent
    env: docker
    dockerfilePath: Dockerfile.agent
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bodh-db
          property: connectionString
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: STT_PROVIDER
        value: deepgram
      - key: TTS_PROVIDER
        value: sarvam

# ==========================================
# 3. Render Managed PostgreSQL Database
# ==========================================
databases:
  - name: bodh-db
    databaseName: bodh_survey_prod
    user: bodh_user
    plan: free

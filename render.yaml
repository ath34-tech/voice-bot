services:
  - type: web
    name: bodh-voice-survey-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PORT
        value: 8000
      - key: HOST
        value: 0.0.0.0
      - key: STT_PROVIDER
        value: deepgram
      - key: TTS_PROVIDER
        value: sarvam
      - key: SARVAM_TTS_MODEL
        value: bulbul:v2
      - key: SARVAM_TTS_SPEAKER
        value: anushka
      - key: DEEPGRAM_STT_LANGUAGE
        value: hi

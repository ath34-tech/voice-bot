services:
  db:
    image: postgres:15-alpine
    container_name: bodh-dev-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: bodh_survey_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: bodh-dev-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - PORT=8000
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@db:5432/bodh_survey_dev
      - LIVEKIT_URL=${LIVEKIT_URL:-wss://your-project.livekit.cloud}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-secret}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - SARVAM_API_KEY=${SARVAM_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - STT_PROVIDER=${STT_PROVIDER:-deepgram}
      - TTS_PROVIDER=${TTS_PROVIDER:-sarvam}
    depends_on:
      db:
        condition: service_healthy

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: bodh-dev-agent
    restart: always
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@db:5432/bodh_survey_dev
      - LIVEKIT_URL=${LIVEKIT_URL:-wss://your-project.livekit.cloud}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-secret}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - SARVAM_API_KEY=${SARVAM_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - STT_PROVIDER=${STT_PROVIDER:-deepgram}
      - TTS_PROVIDER=${TTS_PROVIDER:-sarvam}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
